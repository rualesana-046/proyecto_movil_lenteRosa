name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: el CI no publica nada ni usa secretos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-api:
    name: API (compilación y pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Valida el gradle-wrapper.jar y cachea dependencias.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Docker viene en el runner: Testcontainers levanta PostGIS nativo (amd64).
      - run: ./gradlew build --console=plain
      - name: Subir reportes si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-api-reports
          path: backend-api/build/reports/
          retention-days: 7

  android-app:
    name: App Android (lint y compilación)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # El runner trae el SDK (android-37.0, build-tools 36.0.0) y ANDROID_HOME.
      - run: ./gradlew lint assembleDebug --console=plain
      - name: Subir reportes si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-app-reports
          path: |
            android-app/app/build/reports/
            android-app/build/reports/
          retention-days: 7
