name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: el CI no publica nada ni usa secretos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-api:
    name: API (compilación y pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Valida el gradle-wrapper.jar y cachea dependencias.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Docker viene en el runner: Testcontainers levanta PostGIS nativo (amd64).
      - run: ./gradlew build --console=plain
      - name: Subir reportes si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-api-reports
          path: backend-api/build/reports/
          retention-days: 7

  android-app:
    name: App Android (lint y compilación)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # google-services.json no se versiona: el CI usa uno de relleno, con valores falsos, solo para compilar.
      - name: Usar google-services.json de relleno
        run: cp ../.github/ci/google-services.placeholder.json app/google-services.json
      # Robolectric necesita un Android de unos 200 MB que se publica en Maven Central. Maven Central
      # a veces responde 429 a los runners con un Retry-After de horas, y curl lo respeta: así se
      # canceló el job por tiempo. Por eso se descarga primero del espejo público de Maven Central
      # en Google Cloud Storage, con tiempos máximos por intento, se comprueba su SHA-256 y se
      # guarda en una caché propia apenas se descarga (también en ramas de PR).
      - name: Versión del Android de Robolectric
        id: robolectric
        run: echo "version=$(sed -n 's/^robolectricAndroidAll = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Restaurar el Android de Robolectric
        id: robolectric-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/robolectric-deps
          key: robolectric-${{ steps.robolectric.outputs.version }}
      - name: Descargar el Android de Robolectric
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.robolectric.outputs.version }}
          # SHA-256 de android-all-instrumented-15-robolectric-13954326-i7.jar (su SHA-1 coincide con
          # el publicado en Maven Central). Se actualiza junto con robolectricAndroidAll.
          SHA256: 06c4c8602d6db7486266a982bc55834ed6dfebd62a0b88daca204139ecf142cb
        run: |
          jar="android-all-instrumented-$VERSION.jar"
          path="org/robolectric/android-all-instrumented/$VERSION/$jar"
          mkdir -p ~/robolectric-deps
          for base in https://maven-central.storage-download.googleapis.com/maven2 https://repo1.maven.org/maven2; do
            if curl --fail --location --silent --show-error --max-time 600 \
                 --retry 3 --retry-delay 20 --retry-max-time 900 --retry-all-errors \
                 -o ~/robolectric-deps/"$jar" "$base/$path"; then
              echo "Descargado de $base"
              break
            fi
            echo "No se pudo descargar de $base"
          done
          echo "$SHA256  $HOME/robolectric-deps/$jar" | sha256sum --check
      - name: Guardar el Android de Robolectric
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/robolectric-deps
          key: robolectric-${{ steps.robolectric.outputs.version }}
      # El runner trae el SDK (android-37.0, build-tools 36.0.0) y ANDROID_HOME.
      - run: ROBOLECTRIC_DEPS_DIR="$HOME/robolectric-deps" ./gradlew testDebugUnitTest lint assembleDebug --console=plain
      - name: Subir reportes si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-app-reports
          path: |
            android-app/app/build/reports/
            android-app/build/reports/
          retention-days: 7
